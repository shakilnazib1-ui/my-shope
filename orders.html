<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>আমার অর্ডার — নূর মডেস্ট শপ</title>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: {
      colors: { gold: "#e7c875", cream: "#faf6ee" },
      fontFamily: { sans: ["Hind Siliguri", "sans-serif"], display: ["Noto Serif Bengali", "serif"] }
    } } };
  </script>
</head>
<body class="bg-cream text-emerald-950 font-sans">
  <div id="header"></div>
  <main class="max-w-3xl mx-auto px-4 pt-8">
    <h1 class="font-display text-2xl font-bold mb-6">আমার অর্ডার</h1>
    <div id="list" class="space-y-4"></div>
  </main>
  <div id="footer"></div>
  <script src="js/app.js"></script>
  <script>
    const STATUS = {
      pending: ["অপেক্ষমাণ", "bg-amber-100 text-amber-800"],
      confirmed: ["নিশ্চিত", "bg-blue-100 text-blue-800"],
      shipped: ["পাঠানো হয়েছে", "bg-indigo-100 text-indigo-800"],
      delivered: ["পৌঁছেছে", "bg-emerald-100 text-emerald-800"],
      cancelled: ["বাতিল", "bg-red-100 text-red-800"],
    };
    (async () => {
      if (!requireLogin()) return;
      try {
        const orders = await api("/orders/mine", { auth: true });
        if (!orders.length) {
          $("#list").innerHTML = `<div class="text-center py-16 bg-white rounded-2xl text-emerald-900/70">এখনও কোনো অর্ডার করেননি। <a class="underline text-emerald-800" href="index.html#products">কেনাকাটা করুন</a></div>`;
          return;
        }
        $("#list").innerHTML = orders.map(o => {
          const [label, cls] = STATUS[o.status] || [o.status, "bg-gray-100"];
          return `<div class="bg-white rounded-xl p-5 shadow-sm">
            <div class="flex justify-between items-start gap-3 mb-3">
              <div><div class="font-semibold">অর্ডার #${o.id}</div>
                <div class="text-xs text-emerald-900/60">${new Date(o.created_at + "Z").toLocaleString("bn-BD")}</div></div>
              <span class="text-xs px-3 py-1 rounded-full ${cls}">${esc(label)}</span>
            </div>
            <ul class="text-sm divide-y">${o.items.map(i => `
              <li class="py-2 flex justify-between gap-3"><span>${esc(i.product_name)}${i.size ? " (" + esc(i.size) + ")" : ""} × ${i.quantity}</span>
              <span>${money(i.unit_price * i.quantity)}</span></li>`).join("")}</ul>
            <div class="flex justify-between font-bold pt-3 border-t mt-1"><span>মোট</span><span>${money(o.total)}</span></div>
            <div class="text-xs text-emerald-900/60 mt-2">ঠিকানা: ${esc(o.address)}</div>
          </div>`;
        }).join("");
      } catch (e) { toast(e.message, "err"); if (!Auth.token) location.href = "login.html"; }
    })();
  </script>
</body>
</html>
