<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>সাইন আপ — নূর মডেস্ট শপ</title>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: {
      colors: { gold: "#e7c875", cream: "#faf6ee" },
      fontFamily: { sans: ["Hind Siliguri", "sans-serif"], display: ["Noto Serif Bengali", "serif"] }
    } } };
  </script>
</head>
<body class="bg-cream text-emerald-950 font-sans">
  <div id="header"></div>
  <main class="max-w-md mx-auto px-4 pt-12">
    <form id="f" class="bg-white rounded-2xl shadow-sm p-7 space-y-4">
      <h1 class="font-display text-2xl font-bold">নতুন অ্যাকাউন্ট</h1>
      <div><label class="text-sm font-medium">পূর্ণ নাম</label>
        <input name="name" required minlength="2" autocomplete="name" class="mt-1 w-full px-3 py-2 rounded-lg border border-emerald-900/20 focus:outline-none focus:ring-2 focus:ring-emerald-700"></div>
      <div><label class="text-sm font-medium">ইমেইল</label>
        <input name="email" type="email" required autocomplete="email" class="mt-1 w-full px-3 py-2 rounded-lg border border-emerald-900/20 focus:outline-none focus:ring-2 focus:ring-emerald-700"></div>
      <div><label class="text-sm font-medium">মোবাইল নম্বর</label>
        <input name="phone" type="tel" autocomplete="tel" class="mt-1 w-full px-3 py-2 rounded-lg border border-emerald-900/20 focus:outline-none focus:ring-2 focus:ring-emerald-700"></div>
      <div><label class="text-sm font-medium">পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)</label>
        <input name="password" type="password" required minlength="6" autocomplete="new-password" class="mt-1 w-full px-3 py-2 rounded-lg border border-emerald-900/20 focus:outline-none focus:ring-2 focus:ring-emerald-700"></div>
      <div><label class="text-sm font-medium">পাসওয়ার্ড আবার দিন</label>
        <input name="password2" type="password" required autocomplete="new-password" class="mt-1 w-full px-3 py-2 rounded-lg border border-emerald-900/20 focus:outline-none focus:ring-2 focus:ring-emerald-700"></div>
      <button id="btn" class="w-full bg-emerald-900 text-white py-3 rounded-full font-semibold hover:bg-emerald-800 disabled:opacity-50">সাইন আপ</button>
      <p class="text-sm text-center">আগেই অ্যাকাউন্ট আছে? <a href="login.html" class="text-emerald-800 font-semibold underline">লগইন করুন</a></p>
    </form>
  </main>
  <div id="footer"></div>
  <script src="js/app.js"></script>
  <script>
    if (Auth.token) location.href = "index.html";
    $("#f").onsubmit = async (e) => {
      e.preventDefault();
      const f = new FormData(e.target), btn = $("#btn");
      if (f.get("password") !== f.get("password2")) return toast("দুই পাসওয়ার্ড মিলছে না", "err");
      btn.disabled = true;
      try {
        const data = await api("/auth/register", { method: "POST", body: {
          name: f.get("name"), email: f.get("email"), phone: f.get("phone") || null, password: f.get("password") } });
        Auth.set(data);
        const next = sessionStorage.getItem("after_login");
        sessionStorage.removeItem("after_login");
        location.href = next || "index.html";
      } catch (err) { toast(err.message, "err"); btn.disabled = false; }
    };
  </script>
</body>
</html>
